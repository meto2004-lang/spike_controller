name: Python regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify transport imports without connecting hardware
        run: python -c "from pybricksdev.connections.pybricks import PybricksHubBLE, PybricksHubUSB; import serial, libusb_package"
      - name: Compile application
        run: python -m py_compile spike_core.py spike_transfer.py spike_documents.py spike_icons.py spike_controller.py spike_paths.py spike_templates.py spike_race.py spike_workspace.py spike_hub.py spike_server.py
      - name: Check browser scripts
        run: node --check web/js/i18n.js && node --check web/js/editor.js && node --check web/js/app.js
      - name: Browser app smoke test (jsdom)
        run: npm install --no-save jsdom && node tools/ui_smoke.js
      - name: Headless regression tests (no robot required)
        run: python -W error::RuntimeWarning reports/verify_findings.py
      - name: Real Tk document tabs/layout tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -W error::RuntimeWarning reports/verify_findings.py --pattern test_filename_ui.py
