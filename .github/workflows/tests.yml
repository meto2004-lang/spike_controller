name: Python regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Verify Qt imports
        run: python reports/verify_qt.py
      - name: Verify transport imports without connecting hardware
        run: python -c "from pybricksdev.connections.pybricks import PybricksHubBLE, PybricksHubUSB; import serial, libusb_package"
      - name: Compile application
        run: python -m py_compile spike_core.py spike_transfer.py spike_documents.py spike_icons.py spike_controller.py spike_qt.py spike_qt_text.py
      - name: Headless regression tests (no robot required)
        run: python -W error::RuntimeWarning reports/verify_findings.py
      - name: Real Tk document tabs/layout tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -W error::RuntimeWarning reports/verify_findings.py --pattern test_filename_ui.py
      - name: Qt application smoke test without Tk or robot
        run: python -c "import sys; sys.modules['tkinter'] = None; from spike_controller import selftest; selftest()"
